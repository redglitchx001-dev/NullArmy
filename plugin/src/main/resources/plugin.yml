# Bukkit-style descriptor is used intentionally: it provides command metadata
# to JavaPlugin#getCommand while the Paper-only NMS adapter is Mojang-mapped.
name: NullArmy
version: ${version}
main: redglitchx.nullarmy.plugin.NullArmyPlugin
api-version: '1.21.11'
authors: [RedGlitchX]
description: Version-specific Paper plugin for physically simulated Null NPCs.
website: https://github.com/redglitchx001-dev/NullArmy

commands:
  # Quoted on purpose: an unquoted `null` is YAML's null value, which gives the
  # command map a null key and crashes Paper's PluginDescriptionFile on load.
  "null":
    description: Manage NullArmy squads and plugin features.
    usage: "/null <menu|help|status|ai|version|features|debug|horn|totem|commander|respawn|loadout|skin|follow|guard|formation|tactics|attack|attackx|come|tp|bring|portal|emote|greet|stop|dismiss|list|info|name|inv|heal|equip|drop|portals|clearskins|reload|wand|build|chat|withercannon|cannon|airdrop|ban|kill>  -  /null help lists every subcommand. In chat, say \"null <order>\" with no slash."

permissions:
  nullarmy.summon:
    description: Summon Nulls with a Call Horn or Totem Of Null.
    default: op
  nullarmy.gui:
    description: Open the Commander loadout editor.
    default: op
  nullarmy.commander:
    description: Summon the Null Commander out of a portal.
    default: op
  nullarmy.admin:
    description: View NullArmy diagnostics and manage all squads.
    default: op
  nullarmy.chat:
    description: Talk to the Nulls and the Commander in a private channel.
    default: op
  nullarmy.attack:
    description: Set a physical pursuit/combat objective.
    default: op
  nullarmy.attackx:
    description: Use the adaptive extreme-combat profile.
    default: op
  nullarmy.follow:
    description: Make Nulls follow you.
    default: op
  nullarmy.build:
    description: Command Nulls to build.
    default: op
  nullarmy.moderation:
    description: Moderation actions; never usable by an AI agent.
    default: false
