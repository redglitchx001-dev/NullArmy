# =====================================================================
#  NullArmy configuration. Copyright (c) RedGlitchX. All rights reserved.
#
#  Non-destructive features are enabled where practical. Protection-sensitive
#  and destructive settings remain OFF by default; do not treat a request to
#  "make everything true" as permission to enable world damage blindly.
#  The two switches marked  !! MAP PROTECTION !!  below are:
#
#     policy.griefing-enabled   - permits configured Null block destruction
#     wither-cannon.blocks-damage - permits the cannon explosion to break blocks
#
#  With block damage off, the real charged Wither Skull explosion still occurs
#  with its vanilla sound, particles, entity damage and knockback; only its
#  block list is cleared. The cannon does not spawn TNT minecarts. Turn block
#  damage on only on a map where that destructive behavior is intended.
#
#  UPDATES: when this build ships a setting your file does not have yet, it
#  is APPENDED to the bottom of your config.yml (with a timestamped backup
#  next to it). Nothing you wrote is ever overwritten or rewritten, so your
#  comments stay where they are. /null reload reports what it added.
#
#  QUICK ANSWER: where do I add AI endpoints?
#
#    1. Add as many as you like under  ai.endpoints:  - each one is:
#
#         my-model:
#           endpoint: "https://api.example.com/v1"   # base URL
#           model-id: "example-flash"                # the model id
#           api-key:  "env:MY_API_KEY"               # key, or env:VARNAME
#           enabled: true
#
#    2. ai.enabled is already true. An endpoint with no key just fails and
#       falls back to the local coordinator, so only enable the ones you have
#       credentials for.
#
#  SECURITY: `api-key: "env:NAME"` stores only the NAME of an environment
#  variable. The real key is read from the server process at call time, so it
#  is never written to config, chat, logs, git, or the jar.
# =====================================================================

limits:
  # Hard maximum of Nulls alive on the whole server.
  max-live-npcs: 100
  # Hard maximum one summon may ask for.
  summon-hard-cap: 100
  path-max-expansions: 4096
  # Ceiling on entities NullArmy itself tracks and cleans up (TNT, minecarts,
  # dropped squad gear). Reaching it refuses new spawns with a clear message.
  max-tracked-entities: 100

visuals:
  # Spec 3 requires AT LEAST 15 portal effects per summon. Values below 15 are
  # raised to 15 at startup, so the visual floor can never be configured away.
  # This particle count is ON TOP OF the real portal doorways below, never instead.
  # The minimum of 15 is still enforced whenever particles are enabled.
  portal-effects-per-summon: 16
  # Set false to suppress cosmetic portal particles. Frames, walk-out, cleanup and
  # the optional portal sounds continue to work normally.
  portal-particles-enabled: true

summoning:
  # Ticks before an unanswered "how many Nulls?" prompt expires (20 ticks = 1s).
  prompt-timeout-ticks: 300
  # How far from you the plugin looks for collision-safe ground for each Null.
  spawn-search-radius: 6

# ---------------------------------------------------------------------
#  ARRIVAL PORTALS  -  real, temporary doorways the Nulls walk out of
#
#  A particle effect is not an entrance. For every summon the plugin picks a
#  RANDOM number of doorways from 1 up to max-per-summon, splits the Nulls
#  between them at random, builds each one out of real blocks, and spawns the
#  Nulls at the verified exit spots in front of the openings.
#
#  It cannot damage your map:
#    * a site is only used when every block the frame needs is already air -
#      one existing block and the site is refused;
#    * every block placed is recorded with its original data and put back when
#      the doorway expires/exits, on /null portals clear, and on plugin disable;
#      persist-until-clear is an explicit opt-in to keep it standing meanwhile;
#    * blocks are written with physics off, so nothing catches fire, falls or
#      flows, and no second portal is ever created;
#    * portal travel through these blocks is cancelled, so nobody is sent to the
#      Nether by a Null's doorway.
# ---------------------------------------------------------------------
portals:
  enabled: true
  # HARD maximum doorways one summon may open. The plugin also refuses to go
  # above 16 whatever this says.
  max-per-summon: 4
  # One or two Nulls emerge per doorway; spread larger squads across more doors.
  max-per-portal: 2
  # How many doorways may be standing in the world at once.
  max-active: 32
  # How long a doorway stays before its blocks are put back (20 ticks = 1s).
  # Superseded by lifetime-s below when that key is present.
  lifetime-ticks: 600
  # A doorway is an upright, complete obsidian frame (4 wide, 5 tall) with six
  # real NETHER_PORTAL blocks filling the 2x3 opening. Nulls start inside and
  # physically walk out; portal-travel events from these owned blocks are
  # cancelled. The frame and portal blocks are restored on timeout or when the
  # last assigned Null has stepped clear (see below).
  lifetime-s: 30
  restore-after-exit: true
  # Opt-in: keep frames after lifetime and walk-out until /null portals clear.
  # Plugin disable still restores them. This overrides lifetime-s and restore-after-exit.
  persist-until-clear: false
  # Share of doorways that hang in the air instead of standing on the ground.
  # Nulls drop out of a floating doorway and take real fall damage.
  floating-chance: 0.35
  # Height of the air gap under a floating doorway, in blocks.
  air-height-min: 4
  air-height-max: 12
  # How far from the summoner a build site is searched for.
  search-radius: 6
  # !! MAP PROTECTION !! Leave false. True would let a player who stands in one
  # of these doorways travel to the Nether, which also generates a portal there.
  allow-travel: false

# ---------------------------------------------------------------------
#  TOTEM OF NULL  -  the army's heart
#
#  The item is named exactly "The Totem Of Null", carries the real Curse of
#  Vanishing, and is recognised by its persistent-data tag (nullarmy:
#  totem_of_null), so renaming or moving it cannot break recognition.
#
#  "Destroyed" means exactly one of:
#    1. it POPS - somebody dies holding it and vanilla consumes it;
#    2. a dropped totem takes any damage (fire, lava, explosion, cactus);
#    3. a dropped totem despawns after its five minutes (see below).
#  It does NOT mean: moving it between slots, putting it in a chest, renaming
#  it, enchanting it, dropping it, or reloading the plugin.
#
#  When it happens, EVERY Null - including the Commander - goes out one at a
#  time with a visible delay between them, queued summons are cancelled, and no
#  new Null may appear until the last one has gone.
# ---------------------------------------------------------------------
totem:
  shutdown-enabled: true
  # Visible gap between two Nulls going out. 10 ticks = half a second.
  shutdown-delay-ticks: 10
  # Report progress in chat (every tenth body, and the last one).
  announce-progress: true
  # Whether a totem that despawns on the ground also ends the army. Turn this
  # off if you would rather a dropped totem only mattered while it exists.
  despawn-triggers-shutdown: true

# ---------------------------------------------------------------------
#  DEFAULT EQUIPMENT  -  the Commander and every Null
#
#  Format is  slot:MATERIAL:count .  Slots are the real player-inventory
#  numbers: 0-8 hotbar, 9-35 storage, 36 boots, 37 leggings, 38 chestplate,
#  39 helmet, 40 offhand. Armour and the offhand are written to those slots
#  directly, because Bukkit's setItem(36..40) silently does nothing.
#
#  The kit is applied to every new Null, and to the Commander ONLY when no
#  Commander loadout is saved yet (a fresh install, or a deleted commander.yml).
#  An owner-edited loadout from the GUI is never touched. Re-applying a kit
#  writes only the slots that are missing, so nothing is ever duplicated.
# ---------------------------------------------------------------------
loadout:
  apply-to-nulls: true
  apply-to-commander: true
  # v3 format: slot:MATERIAL[:count][|enchantment=level,...,potion=type]
  # 0-8 hotbar, 9-35 storage, 36 boots, 37 leggings, 38 chestplate, 39 helmet, 40 offhand.
  # A list that is exactly the pre-v3 iron kit is treated as unedited and upgraded.
  default-kit:
    - "0:NETHERITE_SWORD:1|sharpness=5,unbreaking=3"
    - "1:BOW:1|power=5,infinity=1"
    - "2:NETHERITE_AXE:1|efficiency=5,unbreaking=3"
    - "3:NETHERITE_PICKAXE:1|efficiency=5,fortune=3,unbreaking=3"
    - "4:GOLDEN_APPLE:4"
    - "5:POTION:2|potion=strong_healing"
    - "6:COBBLESTONE:64"
    - "7:WATER_BUCKET:1"
    - "8:ENDER_PEARL:4"
    - "9:ARROW:1"
    - "10:NETHERITE_SHOVEL:1"
    - "11:POTION:1|potion=strong_strength"
    - "12:POTION:1|potion=strong_regeneration"
    - "13:ENCHANTED_GOLDEN_APPLE:4"
    - "14:DEEPSLATE:64"
    - "15:OBSIDIAN:16"
    - "16:TORCH:32"
    - "17:MACE:1|breach=4,wind_burst=3"
    - "18:TOTEM_OF_UNDYING:2"
    - "19:WIND_CHARGE:16"
    - "20:FIREWORK_ROCKET:32"
    - "36:NETHERITE_BOOTS:1|protection=4,unbreaking=3,feather_falling=4"
    - "37:NETHERITE_LEGGINGS:1|protection=4,unbreaking=3"
    - "38:NETHERITE_CHESTPLATE:1|protection=4,unbreaking=3"
    - "39:NETHERITE_HELMET:1|protection=4,unbreaking=3"
    - "40:SHIELD:1|unbreaking=3"

menu:
  # Title of the /null menu inventory. Plain text; the plugin styles it itself.
  title: "NullArmy — Command Center"

# ---------------------------------------------------------------------
#  CHAT  -  talk to the Commander, order the Nulls
#
#  Only the Commander holds a conversation. Ordinary Nulls take ORDERS and
#  give no chat replies at all: "null guard", "null follow", "null formation
#  square", "null attack Steve". Orders run through the same /null executor as
#  typing them, so permissions, caps and policy gates are identical.
#
#  Public Commander replies are printed like a normal player line: Name: message.
#  Command confirmations and private replies still use the plugin's own prefix.
# ---------------------------------------------------------------------
chat:
  enabled-by-default: true
  commander-only-conversation: true
  nulls-orders-only: true
  # v4: how a player gets the Commander's attention. With the default "@" the
  # Commander answers anyone who writes "@NullCommander ..." (or his own name at
  # the start of a line), while the wake words below still work for everybody.
  mention-prefix: "@"
  # Unit status/arrival/kit/mission announcements stay out of public chat;
  # vanilla Null death messages remain visible like any player's.
  silence-units: true
  wake-words:
    # Quoted: an unquoted `null` is YAML's null value, not the word.
    - "null"
    - "nulls"
    - "commander"
  # Orders one player may give per minute through chat.
  commands-per-minute: 20
  # Longest reply the plugin will print, in characters.
  max-reply-chars: 400
  # Commander/private chat lines are plain character dialogue by default; set
  # true only if you explicitly want the visible [NullArmy] tag on those lines.
  plugin-prefix: false
  # A private channel closes after this many seconds without a message.
  session-timeout-seconds: 600
  personas:
    # Quoted on purpose: an unquoted `null` key is YAML's null value.
    "null": ""
    commander: ""
  # By default, a line that starts with a wake word or the Commander's name gets
  # a public Commander reply formatted as Name: message. Players can switch their
  # own channel with /null chat public|private|off. OFF still accepts recognized
  # orders; PRIVATE consumes ordinary chat until the session ends.
  commander-public-replies: true
  commander-name-trigger: true

# ---------------------------------------------------------------------
#  NULLS THEMSELVES
#
#  Nulls are announced to every client with a real player-info packet, which
#  is what makes them visible AND what puts them in the tab list. Their names
#  are unique random alphanumeric profile names of at most 16 characters - the
#  configured skin account is only ever the source of the skin texture, never
#  the name of every Null.
# ---------------------------------------------------------------------
nulls:
  show-in-tab-list: true
  plain-names: true
  # Nulls pick up items they walk over (the builder relies on it).
  pickup-items: true
  # Nulls push and are pushed like players, and keep this far from each other.
  collisions: true
  separation-radius: 1.0
  # Every Null walks at its own pace: 90-110 % of a player's base speed.
  speed-variance: true
  # Idle life: crouch to rest after a while and eat a golden apple (or drink
  # healing) below this share of health. Idle glances and scans are disabled.
  idle-behaviour: true
  eat-below-health: 0.6
  rest-after-idle-s: 60

# ---------------------------------------------------------------------
#  NAMES  (v4, P-03)
#
#  Every Null receives a unique random 16-character alphanumeric username.
#  Names begin with a letter and include at least one digit. The legacy style
#  key is retained for existing configs; its old "words" value no longer
#  overrides the requested random-name behavior.
# ---------------------------------------------------------------------
names:
  style: "codes"

# ---------------------------------------------------------------------
#  SUMMON ZONE  (v3)
#
#  A summon opens a square zone of this edge length centred on the horn user.
#  Every doorway, every arrival and every AI build step stays inside it; when
#  nothing fits, the summoner is told why instead of anything being built
#  outside. /null zone shows the border for five seconds. Clamped to 16..200.
# ---------------------------------------------------------------------
summon:
  zone-size: 100

# ---------------------------------------------------------------------
#  COMBAT  (v3)  -  vanilla combat, nothing scripted
#
#  Nulls swing only with a full attack cooldown, crit by striking while falling,
#  carry sprint knockback, strafe at 2-3 blocks, raise shields between swings,
#  lead and arc their bow shots, and back off to eat below 30 % health.
#  They pursue and face targets only on explicit attack/hunt orders. Retaliation
#  can defend at melee range, but never causes a Null to acquire or chase a
#  target on its own. Server PvP rules for real players are never overridden.
# ---------------------------------------------------------------------
combat:
  enabled: true
  # A real player's melee and arrows hurt a Null (even on a pvp=false server).
  players-can-hit-nulls: true
  nulls-can-hit-nulls: true
  # v4 (P-01): hard reach gate. A Null may only strike inside this many blocks,
  # eye to target, and only with a clear line of sight - never through a wall or
  # round a corner. Values above the vanilla 3.0 are clamped down to 3.0.
  melee-reach: 3.0
  # v4 (P-02): a Null swings as soon as its cooldown reaches this fraction
  # instead of waiting for a full meter, so it really does rain blows.
  attack-threshold: 0.55
  crit-every-swings: 2
  # v4 (P-05): imperfect aim. 0 = hopeless, 1 = as good as it gets, and even
  # that is never perfect. At 0.65 a shot carries a +-6 degree error, a lead
  # error, a 0.3-0.8 s reaction delay and misses sometimes beyond 12 blocks.
  aim-skill: 0.65
  crits: true
  shields: true
  bows: true
  retaliate: true
  fall-damage: true
  # An axe on a raised shield disables it for this many ticks (30 = 1.5 s).
  shield-disable-ticks: 30

# ---------------------------------------------------------------------
#  FORMATIONS AND ORDERS  (v3)
#
#  line, rank, column, square, wedge, phalanx, arrow (and encircle, turtle):
#  fixed cells rotated by the anchor's facing, never closer than 1.1 blocks.
#  /null order <name|all> <walk|run|sprint|jump|stop|follow|hold|gather|build|
#  attack|defend> - or the same words in chat to the Commander.
# ---------------------------------------------------------------------
formations:
  spacing: 1.5
  auto-reform: true

orders:
  # A Null that takes an order swings its arm and nods.
  gesture-ack: true

# ---------------------------------------------------------------------
#  DEATH DROPS  (v4, P-10)
#
#  A Null used to vanish with its kit - armour, tools, blocks and all - which
#  meant beating one paid nothing. With enabled: true a defeated Null drops what
#  it carries on the ground, exactly like a /kill victim: armour, both hands
#  and the contents of its inventory. chance is the share of the kit that drops
#  (1.0 = everything). Real players' own drops stay vanilla and are never touched.
#  An explicit drops.enabled: false is the only way to suppress Null loot.
# ---------------------------------------------------------------------
drops:
  enabled: true
  chance: 1.0

# ---------------------------------------------------------------------
#  BEHAVIOUR  (v4, L-01..L-08)  -  the Unstable-SMP NULL feeling
#
#  march-cadence: a squad ordered to march shares one step clock, so the line
#                 stays a line instead of stringing out.
#  auto-bridge:   when the owner gives an explicit bridge order, a Null may
#                 place blocks under that route from its own inventory.
#  camp-life:     silent idle life - rest in a ring round a light source, spar
#                 in pairs with zero damage, eat when hurt, haul spare blocks to
#                 a builder that needs them.
# ---------------------------------------------------------------------
behaviour:
  march-cadence: true
  auto-bridge: true
  camp-life: true
  # Ticks between two steps of a march (8 ticks = 0.4 s).
  march-period-ticks: 8
  # Ticks the drill holds one formation before cycling line -> wedge -> phalanx.
  drill-hold-ticks: 80
  # A Null on guard salutes when its owner comes within this many blocks.
  salute-range: 8
  # How many Nulls may break formation to chase a fleeing target (L-07).
  hunt-chasers: 2

# ---------------------------------------------------------------------
#  MECHANICS
# ---------------------------------------------------------------------
mechanics:
  # /null portal moves a Null through a visible portal to you (or to a named
  # player), verifying the arrival spot as collision-safe ground first. This is
  # the one deliberate exception to the no-teleport rule.
  portal-travel: true

# ---------------------------------------------------------------------
#  MISSIONS  -  original NullArmy content
#
#  One objective at a time for the Commander and every active Null: scouting a
#  hidden outpost, a corridor rescue, holding a banner, a squad tournament, a
#  gate vigil, carrying an accord between two camps, a supply run. All of it is
#  written for this plugin - no characters, items, dialogue or plots from any
#  other work.
#
#  Missions move, form up and report. They never destroy a block, spawn an
#  explosive or attack a player, so they are safe with every policy switch off.
# ---------------------------------------------------------------------
missions:
  enabled: true

# ---------------------------------------------------------------------
#  SELF TEST  -  /null selftest
#
#  Runs the real spawn path against the running server: one Null, then a squad,
#  then many ticks, then the portals and the totem shutdown, printing PASS/FAIL
#  per check with the marker [NullArmy][SELFTEST]. This is what CI runs.
# ---------------------------------------------------------------------
selftest:
  squad-size: 5

# ---------------------------------------------------------------------
#  AI ENDPOINTS  —  add as many as you want
# ---------------------------------------------------------------------
ai:
  # Deterministic local builder: /null ai build <goal> (or "Commander, build a hut"
  # in chat) uses local plans for hut, bridge, wall, tower, platform, throne and
  # gathering. AI is never asked to create or modify construction plans. Every
  # block is placed by hand, one per swing, using the Nulls' own inventory.
  # The key can also come from the environment variable NULLARMY_AI_KEY, or use
  # "env:NAME" here. Never commit a key.
  api-key: ""
  builder:
    enabled: true
    # Optional endpoint used only by /null ai test [id] to check connectivity;
    # construction never sends goals or plans to this endpoint. Accepts any
    # OpenAI-compatible base URL or "id:<name>" from ai.endpoints. Empty is fine:
    # deterministic local construction does not need an AI service.
    endpoint: ""
    api-key: ""
    model: ""
    timeout-ms: 20000
    max-steps: 400
    place-rate-ticks: 10
    gather-outside-zone: false

  # Master switch. TRUE means the Commander may ask a model what the squad
  # should do next. FALSE (or no usable endpoint) leaves the local deterministic
  # coordinator available only for an explicit owner order such as /null coordinate.
  enabled: true

  # The Commander gets a live view of its squad (every Null's health, position
  # and role, the objective, formation, tactics, kit state, portal arrivals and
  # what the cannon and air drop are allowed to do) and answers with ONE typed,
  # allowlisted action: report, follow, come, guard, formation, tactics, heal,
  # roles, portal, mission-start, mission-stop, airdrop, cannon, dismiss.
  # A model can never run a console command, grant a permission, enable
  # griefing, ban or kill a player. Cannon, air drop and dismiss always need the
  # owner's /null confirm before anything happens.
  squad-coordination: true
  # Automatic group changes are off: healing, role assignment and guard orders
  # happen only after an explicit /null ai coordinate (or another owner order).
  # Kept as a compatibility setting; true is migrated to false when it is the
  # untouched shipped default.
  auto-coordinate: false
  coordinate-interval-ticks: 400

  # Primary endpoint when no role-specific binding is provided. Leave empty
  # to pick the first enabled endpoint. Remaining enabled entries are automatic
  # fallbacks in YAML order. A missing/disabled id warns and uses the first enabled.
  default-endpoint: ""

  defaults:
    timeout-millis: 3000
    calls-per-minute: 20
    max-json-bytes: 8192

  # ===================================================================
  #  ENDPOINTS - these examples are disabled until you enable/configure one.
  #  For your own entries, enabled defaults to true when omitted. Each endpoint
  #  must speak the OpenAI Chat Completions request/response format.
  # ===================================================================
  endpoints:
    openai:
      endpoint: "https://api.openai.com/v1"
      model-id: "gpt-4o-mini"
      api-key: "env:OPENAI_API_KEY"
      enabled: false

    # Anthropic via an OpenAI-compatible gateway. The native Anthropic
    # /v1/messages API uses a different protocol and is not accepted here.
    anthropic:
      endpoint: "https://openrouter.ai/api/v1"
      model-id: "anthropic/claude-3.5-sonnet"
      api-key: "env:OPENROUTER_API_KEY"
      enabled: false

    openrouter:
      endpoint: "https://openrouter.ai/api/v1"
      model-id: "meta-llama/llama-3.1-8b-instruct"
      api-key: "env:OPENROUTER_API_KEY"
      enabled: false

    gemini:
      endpoint: "https://generativelanguage.googleapis.com/v1beta/openai"
      model-id: "gemini-2.0-flash"
      api-key: "env:GEMINI_API_KEY"
      enabled: false

    # A local Ollama needs no key at all: set enabled: true if you run one.
    ollama-local:
      endpoint: "http://127.0.0.1:11434/v1"
      model-id: "llama3"
      api-key: ""
      enabled: false

  # ===================================================================
  #  OPTIONAL - per-role routing. Valid roles include ChatCommander,
  #  CombatTactician, PathfinderCore, ScoutObserver, ThreatAnalyst,
  #  LogisticsQuartermaster, MedicTriage, FormationTactician,
  #  RedstoneAnalyst, MiningForeman, IdleBehaviourDirector,
  #  GuardianAuditor. Legacy BuilderAgent accepts connectivity tests only;
  #  build planning is deterministic and local.
  # ===================================================================
  # agents:
  #   CombatTactician:
  #     endpoint: "ollama-local"
  #     fallbacks: ["openai"]
  #     enabled: true

# ---------------------------------------------------------------------
#  SKINS  -  the texture source only, never the name
# ---------------------------------------------------------------------
skins:
  # Optional account whose signed skin Nulls may use. Blank means no account
  # skin is requested; no player's skin is selected by default. Nulls keep their
  # own unique random profile names regardless of this texture source.
  # NOTE: the key is "nulls", not "null" - in YAML an unquoted `null` is the
  # null value, not the word.
  nulls: ""

  # Skin for the Commander. Empty = same configured skin as ordinary Nulls.
  commander: ""

  # Optional administrator-provided PNG, relative to plugins/NullArmy and
  # restricted to the skins/ directory. Blank disables this source.
  # Only 64x64 or legacy 64x32 PNG skins up to 2 MiB are accepted.
  png-path: "skins/null.png"

  # Skin priority: 1) signed value + signature pasted here; 2) the configured
  # PNG signed through MineSkin; 3) proxy-url; then 4) the explicitly configured
  # Mojang account. Minecraft needs signed texture data; raw PNG bytes cannot be
  # applied directly. /null reload re-signs changed PNGs and live-reapplies the
  # resolved skin without a relog.
  value: ""
  signature: ""
  # MineSkin API key from https://account.mineskin.org/keys. Prefer an environment
  # variable so the key is not stored in this file, for example env:MINESKIN_API_KEY.
  mineskin:
    api-key: ""
  # Any URL answering {"value":"...","signature":"..."} (MineSkin and Mojang
  # session shapes work too) or raw base64. Diagnostics never print URL paths,
  # query values, or response-body previews.
  proxy-url: ""
  live-reapply: true

commander:
  # The Commander's in-game username. It is used exactly as a normal player name
  # is: no colours, no symbols, and it is what the tab list shows.
  name: "NullCommander"
  spawn-with-portal: true

# ---------------------------------------------------------------------
#  POLICY
#
#  explosives and wither are ON so the cannon and the sky portals work.
#  griefing is OFF: that is the switch that would let an explosion destroy
#  blocks, and the owner has to choose it explicitly.
# ---------------------------------------------------------------------
policy:
  # !! MAP PROTECTION !! true would let NullArmy explosions break blocks.
  griefing-enabled: false
  explosives-enabled: true
  wither-enabled: true
  # Gates /null ban. A ban is a human moderation action and is NEVER reachable
  # by an AI endpoint, whatever this says. The nullarmy.moderation permission
  # still has to be granted to anyone who should be able to use it.
  moderation-integration-enabled: true
  # v4 (P-09): names or UUIDs the army must never hunt. "null attack them"
  # skips everyone on this list, and so does every other targeting rule.
  protected: []

# =====================================================================
#  WITHER CANNON  —  a real TNT minecart, delivered through sky portals
#
#  /null withercannon (alias /null cannon) fires a tracked TNT minecart from
#  verified free air, opens portal clusters at the top of the arc, drops the
#  configured TNT through them one per tick, then removes the cart before it can
#  land and explode somewhere nobody asked for.
#
#  A shot is never reported as successful unless an entity was really created
#  and TNT was really delivered: a failed spawn says how many TNT were lost and
#  why, and a shot that cannot deliver gives up after three failed attempts
#  instead of retrying for the rest of the session.
#
#  /null status and /null debug print the cannon's exact state, including which
#  setting or permission is missing when it cannot fire.
# =====================================================================
wither-cannon:
  # v4 (P-08): OPT-IN. The barrage is a huge sphere of wither-blue skulls, so it
  # is off until the owner turns it on: set this to true, then /null cannon aim,
  # look at the target, right-click the rod to lock it, /null cannon fire.
  enabled: false
  require-permission: nullarmy.admin
  max-charge: 3
  tnt-per-shot: 3
  cooldown-seconds: 20
  # !! MAP PROTECTION !! Needs policy.griefing-enabled to be true as well.
  blocks-damage: false
  # ---- v4: the orbital barrage -----------------------------------------
  # How many barrages one fire order launches.
  shots: 3
  # Wither skulls per barrage. 24 reads as a real sphere in the sky.
  skulls-per-shot: 24
  # Backwards-compatible alias: minecarts-per-shot is accepted too.
  minecarts-per-shot: 24
  # sphere = a converging shell, rain = a wide column, line = a single rank.
  pattern: "sphere"
  # Ticks before a landed skull detonates (60 = 3 s).
  fuse-ticks: 60
  # Ticks between two barrages of one fire order (10 = 0.5 s).
  shot-delay-ticks: 10
  # How far the aiming rod can see for a target, in blocks.
  range: 120
  # Horizontal radius of one barrage, in blocks.
  radius: 8
  # How far above the target the skulls appear, in blocks.
  height: 40

# =====================================================================
#  AIR DROP  —  sky portals that deliver a squad
#
#  With drop-nulls-from-sky: true the Nulls appear at the sky portal mouth and
#  fall under real vanilla gravity, INCLUDING real fall damage. Some may die on
#  landing. That is the honest, physical version, and it is why the switch
#  exists; set it to false and every Null emerges from ground-level doorways
#  onto verified safe ground instead.
# =====================================================================
airdrop:
  enabled: true
  require-permission: nullarmy.admin
  portals: 16
  drop-nulls-from-sky: true
  # How far above the summoner the sky portal opens (3-60, clamped).
  height: 12
  # TNT dropped from the sky portals as part of the show (same policy switches).
  tnt-per-drop: 2
