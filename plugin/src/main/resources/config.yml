# =====================================================================
#  NullArmy configuration. Copyright (c) RedGlitchX. All rights reserved.
#
#  QUICK ANSWER: where do I add endpoints?
#
#    1. Add as many as you like under  ai.endpoints:  — each one is three lines:
#
#         my-model:
#           endpoint: "https://api.example.com/v1"   # base URL, http or https
#           model-id: "example-flash"                # the model id
#           api-key:  "env:MY_API_KEY"               # key, or env:VARNAME
#
#    2. Repeat that block for every model you want. NO LIMIT — add 1, 5 or 50.
#    3. Set  ai.enabled: true  and set  enabled: true  on the endpoints you want.
#
#  That is all. The optional  ai.agents:  section at the bottom is NOT required;
#  ignore it unless you want different models for different jobs.
#
#  Endpoints that are disabled, unreachable, rate-limited, or whose circuit
#  breaker is open are skipped, and the next one is tried. If none answer, the
#  plugin falls back to deterministic local logic. The server tick is never
#  blocked on a network call.
#
#  SECURITY: `api-key: "env:NAME"` stores only the NAME of an environment
#  variable. The real key is read from the server process at call time, so it
#  is never written to config, chat, logs, git, or the jar. Writing the key
#  inline works too, but a warning is logged because it sits in plain text.
# =====================================================================

limits:
  max-live-npcs: 64
  summon-hard-cap: 24
  path-max-expansions: 4096
  # Hard ceiling on entities NullArmy itself keeps track of and cleans up
  # (TNT, minecarts, dropped squad gear). Reaching it refuses new spawns with a
  # clear message instead of quietly growing without bound.
  max-tracked-entities: 256

visuals:
  # Spec 3 requires AT LEAST 15 portal effects per summon. Values below 15 are
  # raised to 15 at startup, so the visual floor can never be configured away.
  portal-effects-per-summon: 16

summoning:
  # Ticks before an unanswered "how many Nulls?" prompt expires (20 ticks = 1s).
  prompt-timeout-ticks: 300
  # How far from you the plugin looks for collision-safe ground for each Null.
  # Bigger finds room in tight builds; smaller keeps the squad tighter.
  spawn-search-radius: 6

menu:
  # Title of the /null menu inventory. Plain text; the plugin styles it itself.
  title: "NullArmy — Command Center"

chat:
  enabled-by-default: false
  # Let the player give orders by talking to a Null in ordinary chat, with no
  # slash: "null attack Steve", "null come", "null stop", "null heal" ...
  # The wake word is stripped and the rest is dispatched through the same
  # /null executor, so permissions, caps and policy gates are identical.
  # The order itself is not broadcast to the server.
  wake-words:
    - null
    - nulls
    - commander
  # Orders one player may give per minute through chat. Stops a stuck key or a
  # macro from turning into a spawn storm.
  commands-per-minute: 20
  # Longest reply the plugin will print, in characters.
  max-reply-chars: 400
  # A private channel closes after this many seconds without a message.
  session-timeout-seconds: 600
  # Who the characters are. {player} is replaced with the speaker's name.
  # Leave empty to use the built-in soldier voice.
  personas:
    null: ""
    commander: ""

# ---------------------------------------------------------------------
#  MECHANICS
# ---------------------------------------------------------------------
mechanics:
  # /null portal moves a Null through a visible portal to you (or to a named
  # player). It plays portal effects at both ends and verifies the arrival spot
  # as collision-safe ground first. This is the one deliberate exception to the
  # no-teleport rule; set it to false and the Nulls refuse to cross.
  portal-travel: true
  # Nulls occasionally look around on their own, and turn to face their owner
  # when one walks past. Purely cosmetic; budgeted per tick.
  idle-gestures: true

# ---------------------------------------------------------------------
#  AI ENDPOINTS  — add as many as you want
# ---------------------------------------------------------------------
ai:
  # Master switch.
  #
  # FALSE (default) = the plugin is COMPLETE and FULLY FUNCTIONAL with no AI
  # at all. Every structural feature works: summoning, portal, movement,
  # flocking, pathfinding, the Commander, its loadout, the shared skin, and
  # all mace/elytra combat techniques. A few extras need a model - run
  # /null features to see exactly which.
  #
  # TRUE = additionally use the endpoints below to enrich decisions.
  enabled: false

  # Which endpoint a role uses when it has no explicit binding below.
  # Set it to the id of any endpoint defined under ai.endpoints.
  # Leave it empty ("") to auto-pick the first enabled endpoint.
  default-endpoint: ""

  # Defaults inherited by any endpoint that does not override them.
  defaults:
    timeout-millis: 3000
    calls-per-minute: 20
    max-json-bytes: 8192

  # ===================================================================
  #  ENDPOINTS  -  ADD AS MANY AS YOU WANT. THERE IS NO LIMIT.
  #
  #  Every entry is exactly three lines you care about:
  #
  #    <name>:        any unique name you like
  #      endpoint:    the base URL  (must start with http:// or https://)
  #      model-id:    the model id  (sent with every request)
  #      api-key:     the key       (env:VARNAME recommended, or the literal key)
  #
  #  To add another model: copy any block below, rename it, change those
  #  three lines. Repeat as many times as you want.
  #
  #  More endpoints = better performance for players and for the Null
  #  Commander: when one model is slow, rate-limited or down, the next
  #  one in the list is tried instead of the Commander going silent.
  #
  #  api-key forms:
  #    api-key: "env:OPENAI_API_KEY"  <- RECOMMENDED. Only the NAME is
  #                                      stored here; the real key is read
  #                                      from the server process environment
  #                                      at call time, so it never sits in
  #                                      config.yml, the jar, git or backups.
  #    api-key: "sk-xxxxx"            <- works, but is plain text on disk.
  #                                      Can leak through a paste, a
  #                                      screenshot or a git commit. A
  #                                      warning is logged at startup.
  #    api-key: ""                    <- no auth (local models like Ollama)
  # ===================================================================
  endpoints:
    # ---- OpenAI -----------------------------------------------------
    openai:
      endpoint: "https://api.openai.com/v1"
      model-id: "gpt-4o-mini"
      api-key: "env:OPENAI_API_KEY"
      enabled: false

    # ---- Anthropic --------------------------------------------------
    anthropic:
      endpoint: "https://api.anthropic.com/v1"
      model-id: "claude-3-5-sonnet-latest"
      api-key: "env:ANTHROPIC_API_KEY"
      enabled: false

    # ---- OpenRouter (hundreds of models, one key) --------------------
    openrouter:
      endpoint: "https://openrouter.ai/api/v1"
      model-id: "meta-llama/llama-3.1-8b-instruct"
      api-key: "env:OPENROUTER_API_KEY"
      enabled: false

    # ---- Google Gemini (OpenAI-compatible endpoint) -------------------
    gemini:
      endpoint: "https://generativelanguage.googleapis.com/v1beta/openai"
      model-id: "gemini-2.0-flash"
      api-key: "env:GEMINI_API_KEY"
      enabled: false

    # ---- Local Ollama (no key needed) ---------------------------------
    ollama-local:
      endpoint: "http://127.0.0.1:11434/v1"
      model-id: "llama3"
      api-key: ""
      enabled: false

    # ---- COPY THIS BLOCK TO ADD YOUR OWN ------------------------------
    # my-model:
    #   endpoint: "https://my.provider/v1"
    #   model-id: "my-model-id"
    #   api-key: "env:MY_API_KEY"
    #   enabled: true

  # ===================================================================
  #  OPTIONAL - per-role routing. YOU DO NOT NEED THIS.
  #
  #  Omit it entirely and every role uses ai.default-endpoint (or the
  #  first enabled endpoint). It only exists if you want, say, combat
  #  decisions on a fast local model and chat on a large cloud model.
  #
  #  Valid role names: ChatCommander, CombatTactician, BuilderAgent,
  #  PathfinderCore, ScoutObserver, ThreatAnalyst, LogisticsQuartermaster,
  #  MedicTriage, FormationTactician, RedstoneAnalyst, MiningForeman,
  #  IdleBehaviourDirector, GuardianAuditor
  # ===================================================================
  # agents:
  #   CombatTactician:
  #     endpoint: "ollama-local"
  #     fallbacks: ["openai"]
  #     enabled: false
  #   ChatCommander:
  #     endpoint: "openai"
  #     fallbacks: ["gemini"]
  #     enabled: false

skins:
  # -------------------------------------------------------------------
  #  The skin every Null wears, and the skin the Commander wears.
  #
  #  Put the Mojang username of ANY account whose skin you want.
  #  The plugin looks the skin up once and reuses it for every NPC.
  #
  #  If the name does not exist, or the lookup fails, the plugin logs a
  #  warning and Nulls keep the default skin. NOTHING BREAKS - a missing
  #  skin is purely cosmetic and never blocks a spawn.
  #
  #  Leave "commander" empty to make the Commander use the same skin as
  #  ordinary Nulls.
  #
  #  You can also override without editing this file:
  #    -Dnullarmy.skin.null=SomeName
  #    -Dnullarmy.skin.commander=SomeOtherName
  # -------------------------------------------------------------------

  # Skin for ordinary Nulls.
  # NOTE: the key is "nulls", not "null" - in YAML an unquoted `null` is the
  # null value, not the word, and it would silently become an empty key.
  nulls: "uH3WR2v0ti0uTHJ"

  # Skin for the Commander. Empty = same as the Null skin above.
  commander: ""

commander:
  # The Commander's in-game username (player names cannot contain spaces).
  name: "NullCommander"

  # Reserved for future tuning; the Commander always enters through a portal.
  spawn-with-portal: true

policy:
  # All destructive behaviour defaults to false (spec 8).
  griefing-enabled: false
  explosives-enabled: false
  wither-enabled: false
  # Gates /null ban. Off by default; a ban is a human moderation action and is
  # NEVER reachable by an AI endpoint.
  moderation-integration-enabled: false

# =====================================================================
#  WITHER CANNON  —  opt-in spectacle, OFF by default
#
#  /null withercannon  (alias /null cannon) fires a real TNT minecart that
#  arcs into the sky, opens portals at the apex and drops TNT out of them.
#
#  It stays dead until you turn it on here. Even then it needs:
#    1. wither-cannon.enabled: true
#    2. policy.explosives-enabled: true
#    3. policy.wither-enabled: true
#    4. policy.griefing-enabled: true  (only when blocks-damage is true)
#    5. the permission below, held by whoever fires it
#
#  blocks-damage: false keeps the show and protects the map: the TNT still
#  explodes and still looks right, but no block is ever destroyed. Turn it to
#  true only on a server that has accepted explosives and griefing.
# =====================================================================
wither-cannon:
  enabled: false
  require-permission: nullarmy.admin
  # Shots before the cannon must cool down, per player.
  max-charge: 3
  # TNT dropped per shot, spread over several ticks (never dumped in one tick).
  tnt-per-shot: 3
  cooldown-seconds: 20
  # When false, explosions are visual only (no blocks destroyed).
  blocks-damage: false

# =====================================================================
#  AIR DROP  —  sky portals that deliver a squad, OFF by default
#
#  /null airdrop opens portals in the air and on the ground at safe spots.
#  With drop-nulls-from-sky: false (the default) every Null still emerges from
#  ground-level portal effects onto verified safe ground, because a Null that
#  starts mid-air would be spawned inside terrain-free space and would take
#  real fall damage - the spec forbids starting a Null anywhere unsafe.
#
#  drop-nulls-from-sky: true changes that knowingly: Nulls appear at the sky
#  portal mouth and fall under real vanilla gravity, including real fall
#  damage. Some may die on landing. That is your call, not the plugin's.
# =====================================================================
airdrop:
  # OFF by default. A permission alone is never enough: this has to be true too.
  enabled: false
  require-permission: nullarmy.admin
  # Portal effects at the sky mouth and around each ground emergence point.
  # Never below 15, so an air drop always reads as a portal and not a sparkle.
  portals: 16
  # false = every Null emerges out of ground-level portal effects at a spot the
  #         adapter verified as collision-safe; nothing falls, nothing is hurt.
  # true  = the Nulls drop out of the sky portal under real gravity, INCLUDING
  #         real fall damage. This is the honest, physical version, and the
  #         reason the whole feature is opt-in.
  drop-nulls-from-sky: false
  # How far above the summoner the sky portal opens (3-60, clamped).
  height: 12
  # TNT dropped from the sky portals as part of the show (subject to the same
  # policy switches as the cannon).
  tnt-per-drop: 2
