name: Build and verify

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Paper plugin JAR
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and run checks
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Verify distributable JAR and checksum
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' gradle.properties | head -n 1)"
          jar="plugin/build/libs/NullArmy-${version}.jar"
          test -s "$jar"

          contents="$(jar tf "$jar")"
          grep -Fxq "plugin.yml" <<< "$contents"
          grep -Fxq "redglitchx/nullarmy/plugin/NullArmyPlugin.class" <<< "$contents"
          grep -Fxq "redglitchx/nullarmy/core/ledger/ItemLedger.class" <<< "$contents"
          grep -Fxq "redglitchx/nullarmy/nms/v1_21_11/V1_21_11Adapter.class" <<< "$contents"

          descriptor="$(unzip -p "$jar" plugin.yml)"
          grep -Fxq "version: ${version}" <<< "$descriptor"

          manifest="$(unzip -p "$jar" META-INF/MANIFEST.MF)"
          grep -Eiq '^paperweight-mappings-namespace: mojang$' <<< "$manifest"

          sha256sum "$jar" > "${jar}.sha256"
          cat "${jar}.sha256"

      - name: Upload verified JAR
        uses: actions/upload-artifact@v4
        with:
          name: NullArmy-JAR
          path: |
            plugin/build/libs/NullArmy-*.jar
            plugin/build/libs/NullArmy-*.jar.sha256
          if-no-files-found: error
          retention-days: 14
